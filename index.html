<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozmium HitList | Jamaican Music Charts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 16px;background:#151515;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0;font-size:32px}
.subtitle{color:#bbb;margin-top:10px}
nav{display:flex;justify-content:center;gap:20px;padding:18px;background:#111}
nav a{color:#d4af37;text-decoration:none;font-weight:bold}
.hero{text-align:center;padding:45px 20px}
.hero h2{font-size:28px}
.gold{color:#d4af37}
.btn{display:inline-block;background:#d4af37;color:#111;padding:13px 22px;border-radius:8px;text-decoration:none;font-weight:bold}
section{padding:24px 16px;max-width:850px;margin:auto}
.song{background:#191919;border:1px solid #333;border-radius:12px;padding:18px;margin:12px 0}
.song h3{margin:0 0 8px;color:#d4af37}
.song p{color:#bbb;margin:5px 0}
.status{color:#aaa;text-align:center;padding:20px}
footer{text-align:center;color:#888;padding:30px;border-top:1px solid #333}
</style>
</head>
<body>
<header>
<h1>OZMIUM HITLIST</h1>
<p class="subtitle">Official Jamaican Music Charts 🇯🇲</p>
</header>
<nav>
<a href="#home">Home</a>
<a href="#charts">Top 10</a>
<a href="#songs">Songs</a>
</nav>
<div class="hero" id="home">
<h2>Jamaica's <span class="gold">Hottest Music</span></h2>
<p>Discover rising artists and trending dancehall hits.</p>
<a class="btn" href="#songs">Explore Music</a>
</div>
<section id="charts">
<h2 class="gold">🏆 Monthly Top 10</h2>
<div id="chart-list" class="status">Loading charts...</div>
</section>
<section id="songs">
<h2 class="gold">🎵 Approved Songs</h2>
<div id="song-list" class="status">Loading songs...</div>
</section>
<footer>©️ 2026 Ozmium Records. All rights reserved.</footer>
<script>
const db = window.supabase.createClient(
"https://osomzvmmxfbaqzpdrwzh.supabase.co",
"sb_publishable_ZEQoiYcZYHiOdAObyx3azA_Y8Y4bduD"
);

function showSongs(container, songs, ranked=false){
const el=document.getElementById(container);
el.replaceChildren();
if(!songs.length){
el.textContent="No songs available yet.";
return;
}
songs.forEach((song,i)=>{
const card=document.createElement("div");
card.className="song";
const title=document.createElement("h3");
title.textContent=(ranked?"#"+(i+1)+" ":"")+(song.title||"Untitled");
const genre=document.createElement("p");
genre.textContent="Genre: "+(song.genre||"Dancehall");
card.append(title,genre);
if(song.audio_url){
const audio=document.createElement("audio");
audio.controls=true;
audio.preload="none";
audio.src=song.audio_url;
audio.style.width="100%";
card.append(audio);
}
el.append(card);
});
}

async function loadSongs(){
const {data,error}=await db.from("songs")
.select("id,title,genre,audio_url")
.eq("approved",true).limit(50);
if(error){
document.getElementById("song-list").textContent=
"Unable to load songs. Check database permissions and table name.";
console.error(error);
return;
}
showSongs("song-list",data||[]);
}

async function loadCharts(){
const {data,error}=await db.from("monthly_hitlist")
.select("*").order("average_rating",{ascending:false}).limit(10);
if(error){
document.getElementById("chart-list").textContent=
"Charts are not available yet.";
console.error(error);
return;
}
if(!data||!data.length){
document.getElementById("chart-list").textContent=
"No monthly rankings yet. Ratings are coming soon.";
return;
}
const el=document.getElementById("chart-list");
el.replaceChildren();
data.forEach((item,i)=>{
const card=document.createElement("div");
card.className="song";
const heading=document.createElement("h3");
heading.textContent="#"+(i+1)+" "+(item.title||item.song_title||"Song");
const rating=document.createElement("p");
rating.textContent="Rating: "+(item.average_rating??"N/A");
card.append(heading,rating);
el.append(card);
});
}
loadSongs();
loadCharts();
</script>
</body>
</html>
